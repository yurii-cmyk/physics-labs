<body>
<div id="app"></div>

<script>
(function(){

/* ==========================================================================
   TASK DEFINITION — усе, що стосується КОНКРЕТНОЇ лабораторної роботи.
   Щоб зробити нову роботу: скопіюйте цей файл і перепишіть ЛИШЕ цей блок TASK.
   Двигун нижче (секція ENGINE) міняти не потрібно.

   Це приклад-заглушка (одна синусоїда, резистивне навантаження) — вона робоча
   й демонструє повний контракт, включно з isAngle-полем. Видаліть її фізику
   і напишіть свою, зберігши форму об'єкта.
   ========================================================================== */
const TASK = {
  // Короткий slug — намespacing сховища і ключ фільтрації Apps Script.
  id: 'inductor-ac',

  title: 'Індуктивність у колі змінного струму',

  // Реальна котушка індуктивності = ідеальна індуктивність L, послідовно
  // з'єднана з активним опором дроту обмотки R. Незалежно генеруємо саме
  // фізичні параметри котушки (R, L) та параметри джерела (Um, f, φ0U) —
  // а амплітуда струму Im і фазовий зсув є похідними величинами, що
  // випливають із закону Ома для кола змінного струму: Im = Um / Z,
  // Z = √(R² + XL²), XL = ωL.
  params: [
    {id:'Um',    label:'Амплітуда напруги джерела',        unit:'В',  min:2,   max:10},
    {id:'f',     label:'Частота',                          unit:'Гц', min:50,  max:300},
    {id:'phi0U', label:'Початкова фаза напруги',           unit:'°',  min:0,   max:360},
    {id:'R',     label:'Активний опір обмотки котушки',    unit:'Ом', min:20,  max:150},
    {id:'L',     label:'Індуктивність котушки',            unit:'мГн',min:100, max:500}
  ],

  // P = {Um, f, phi0U, R, L}. Струм у колі — спільний для R і L (послідовне
  // з'єднання), тому його амплітуда й фаза обчислюються, а не задаються
  // напряму: напруга на реальній котушці випереджає струм на кут
  // φ = arctan(XL/R) (0° — чисто активний опір, 90° — ідеальна індуктивність).
  simulate(P, quantize){
    const Um = P.Um, f = P.f, R = P.R, L = P.L*1e-3; // Гн
    const phi0Urad = P.phi0U*Math.PI/180;
    const omega = 2*Math.PI*f;
    const XL = omega*L;                    // Ом, індуктивний (реактивний) опір
    const Z = Math.sqrt(R*R + XL*XL);      // Ом, повний опір кола
    const Im = Um/Z;                       // А, амплітуда струму
    const phiRad = Math.atan2(XL, R);      // рад, кут зсуву фаз (0..π/2)
    const phiDeg = phiRad*180/Math.PI;
    const phi0I = ((P.phi0U - phiDeg) % 360 + 360) % 360; // струм відстає від напруги на φ
    const phi0Irad = phi0I*Math.PI/180;

    const T = 1/f;
    const tMax = 3*T; // 3 періоди в кадрі
    const N = 1600;
    const dt = tMax/N;
    const t = new Array(N+1), Vraw = new Array(N+1), Iraw = new Array(N+1);
    for(let i=0;i<=N;i++){
      t[i] = i*dt;
      Vraw[i] = Um*Math.sin(omega*t[i]+phi0Urad);
      Iraw[i] = Im*Math.sin(omega*t[i]+phi0Irad);
    }
    const V = new Array(N+1), I = new Array(N+1);
    for(let i=0;i<=N;i++){
      V[i] = quantize(Vraw[i], Um*1.2);   // вольтметр, повна шкала з запасом 20%
      I[i] = quantize(Iraw[i], Im*1.2);   // амперметр, те саме, в амперах
    }
    return {
      t,
      series: { V, I },
      derived: { T, XL, Z, Im, phiDeg, phi0I, PT: 0.5*Um*Im*Math.cos(phiRad) }
    };
  },

  panels: [
    {title:'[Вхід 1] Вольтметр (напруга на котушці)', color:'#1a56db',
     x:'t', xLabel:'Час', xUnit:'с', xDecimals:4,
     y:'V', yLabel:'Напруга', yUnit:'В', yDecimals:2},
    {title:'[Вхід 2] Амперметр (струм у колі)', color:'#d81c1c',
     x:'t', xLabel:'Час', xUnit:'с', xDecimals:4,
     y:'I', yLabel:'Сила струму', yUnit:'мА', yScale:1000, yDecimals:2}
  ],

  // Активний опір R і реактивний (індуктивний) опір XL винесені в таблицю
  // окремими полями — щоб їх розрізнити, недостатньо Um/Im (це дає лише
  // повний опір Z), тому обидві складові — змістовні завдання для студента.
  // Замість двох окремих початкових фаз (φ0U і φ0I, як в інших тренажерах)
  // тут одразу питаємо про зсув фаз Δφ між напругою і струмом — це саме
  // те, що визначається реальним співвідношенням R і XL. Δφ позначене як
  // isAngle, щоб звірка йшла в градусах абсолютного допуску, а не у
  // відсотках (Δφ може бути малим, і відсоткова похибка тоді "вибухає").
  answerFields: [
    {id:'f',   shortLabel:'f',   label:'Частота f, Гц',                                    unit:'Гц', placeholder:'напр. 120.5', ref:ctx=>ctx.params.f},
    {id:'T',   shortLabel:'T',   label:'Період T, с',                                      unit:'с',  placeholder:'напр. 0.0083', ref:ctx=>ctx.derived.T},
    {id:'Um',  shortLabel:'Um',  label:'Амплітудне значення напруги U<sub>m</sub>, В',      unit:'В',  placeholder:'напр. 7.2',   ref:ctx=>ctx.params.Um},
    {id:'Im',  shortLabel:'Im',  label:'Амплітудне значення струму I<sub>m</sub>, мА',      unit:'мА', placeholder:'напр. 34',    ref:ctx=>ctx.derived.Im*1000},
    {id:'R',   shortLabel:'R',   label:'Активний опір обмотки R, Ом',                      unit:'Ом', placeholder:'напр. 60',    ref:ctx=>ctx.params.R},
    {id:'XL',  shortLabel:'XL',  label:'Реактивний (індуктивний) опір X<sub>L</sub>, Ом',   unit:'Ом', placeholder:'напр. 190',   ref:ctx=>ctx.derived.XL},
    {id:'dphi',shortLabel:'Δφ',  label:'Зсув фаз між напругою і струмом Δφ, °',             unit:'°',  placeholder:'напр. 72',    ref:ctx=>ctx.derived.phiDeg, isAngle:true}
  ]
};

/* ==========================================================================
   ENGINE — узагальнений, не залежить від конкретної задачі.
   Для нової лабораторної роботи цю секцію змінювати НЕ потрібно.
   ========================================================================== */

const ADC_BITS = 16; // роздільна здатність приладу — константа двигуна, не параметр задачі

// Усе сховище й ключ фільтрації Apps Script автоматично прив'язані до TASK.id —
// не потрібно вручну синхронізувати назви між кількома розгорнутими тренажерами.
const CFG_KEY = TASK.id + ":config";
const RESULTS_PREFIX = TASK.id + ":result:";
const ANSWERS_PREFIX = TASK.id + ":answer:";
const LS_PREFIX = 'physlab-sim:' + TASK.id + ':';
const SHEET_KEY = 'engine-' + TASK.id; // має збігатися з ACCESS_KEY у Apps Script

const DEFAULT_CFG = {
  paramRanges: Object.fromEntries(TASK.params.map(p=>[p.id, {min:p.min, max:p.max}])),
  phaseTol: 10,   // ° — глобальний допуск для isAngle-полів (якщо на полі не задано власний)
  key: "teacher123",
  // Apps Script Web App URL (…/exec) — вписаний тут одразу при розгортанні на
  // GitHub Pages: window.storage не існує поза Claude-артефактом, тому cfg
  // потрапляє лише в localStorage КОЖНОГО браузера окремо — щоб endpoint
  // працював однаково у всіх студентів без заходу в ⚙, він має бути тут,
  // а не покладатись на збереження через панель налаштувань.
  endpoint: "https://script.google.com/macros/s/AKfycbzlvLWaoRwXRvt-FeTnj_c9gzq5UTuFs2lxoIcdUx2-vsXQTly_VtYh5FyYO24zRq0LBw/exec"
};

let cfg = null;
let studentId = "";
let studentGroup = "";
let params = null;      // згенеровані параметри, напр. {Um,Im,f,phi}
let sim = null;         // {t, series:{...}, derived:{...}}
let pinned = [];         // прив'язані точки {idx}
let cursorIdx = null;
let teacherMode = false; // true після введення правильного ключа в цьому сеансі
let peekOpen = false;    // чи розгорнута панель параметрів поточного досліду

const root = document.getElementById('app');

// ---------- детермінований RNG зі строки ----------
function hashStr(str){
  let h = 2166136261;
  for(let i=0;i<str.length;i++){
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rangeVal(rng, min, max){ return min + rng()*(max-min); }

function generateParams(id, c){
  const base = hashStr(id.trim().toLowerCase());
  const P = {};
  TASK.params.forEach((def, idx)=>{
    const rng = mulberry32(base ^ (0x1111 * (idx+1))); // фіксована схема, не змінювати
    const r = (c.paramRanges && c.paramRanges[def.id]) || {min:def.min, max:def.max};
    P[def.id] = rangeVal(rng, r.min, r.max);
  });
  P.noiseRng = mulberry32(base ^ 0x5555);
  return P;
}

// ---------- модель 16-бітного АЦП: ±1–2 МЗР дитер, не довільний "% амплітуди" ----------
function quantizeADC(value, fullScaleRange, rng){
  const levels = Math.pow(2, ADC_BITS) - 1;
  const lsb = (2*fullScaleRange) / levels;
  const ditherLSB = rng ? (rng()*4 - 2) : 0;
  let v = value + ditherLSB*lsb;
  v = Math.max(-fullScaleRange, Math.min(fullScaleRange, v));
  return Math.round(v/lsb)*lsb;
}

function runSimulation(id){
  const P = generateParams(id, cfg);
  const quantize = (value, range) => quantizeADC(value, range, P.noiseRng);
  const result = TASK.simulate(P, quantize);
  result.series = { t: result.t, ...result.series };
  return { P, sim: result };
}

// ---------- метадані серії (беруться з тієї панелі, що на неї посилається) ----------
function seriesMeta(id){
  for(const p of TASK.panels){
    if (p.x===id) return {label:p.xLabel||id, unit:p.xUnit||'', scale:p.xScale||1, decimals:p.xDecimals??3};
    if (p.y===id) return {label:p.yLabel||id, unit:p.yUnit||'', scale:p.yScale||1, decimals:p.yDecimals??3};
  }
  return {label:id, unit:'', scale:1, decimals:3};
}
function answerCtx(){ return {params, derived: sim ? sim.derived : {}}; }

// ---------- кругова різниця в градусах (для isAngle-полів) ----------
function angDiff(a,b){
  let d = Math.abs(a-b) % 360;
  if (d>180) d = 360-d;
  return d;
}

// ---------- внутрішній toast (без console.error, щоб не спливала консоль) ----------
function showToast(msg, isError){
  let box = document.getElementById('appToast');
  if (!box){
    box = document.createElement('div');
    box.id = 'appToast';
    box.style.cssText = 'position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:999;'+
      'padding:8px 16px;border-radius:5px;font-size:13px;max-width:90vw;box-shadow:0 2px 8px rgba(0,0,0,.3);'+
      'transition:opacity .3s;';
    document.body.appendChild(box);
  }
  box.style.background = isError ? '#c0392b' : '#2d7a2d';
  box.style.color = '#fff';
  box.textContent = msg;
  box.style.opacity = '1';
  clearTimeout(box._hideTimer);
  box._hideTimer = setTimeout(()=>{ box.style.opacity='0'; }, 4000);
}

// ---------- сховище: window.storage (Claude-артефакт) з fallback на localStorage
// (для автономних .html файлів, відкритих напряму в браузері) ----------
const hasArtifactStorage = (typeof window.storage !== 'undefined' && window.storage !== null);

async function storageGet(key){
  if (hasArtifactStorage) return await window.storage.get(key, true);
  const raw = localStorage.getItem(LS_PREFIX+key);
  return raw!=null ? {key, value:raw, shared:false} : null;
}
async function storageSet(key, value){
  if (hasArtifactStorage) return await window.storage.set(key, value, true);
  localStorage.setItem(LS_PREFIX+key, value);
  return {key, value, shared:false};
}
async function storageList(prefix){
  if (hasArtifactStorage) return await window.storage.list(prefix, true);
  const keys = [];
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if (k && k.startsWith(LS_PREFIX+prefix)) keys.push(k.slice(LS_PREFIX.length));
  }
  return {keys};
}

// ---------- storage helpers ----------
async function loadConfig(){
  try{
    const r = await storageGet(CFG_KEY);
    cfg = r ? {...DEFAULT_CFG, ...JSON.parse(r.value)} : {...DEFAULT_CFG};
  }catch(e){ cfg = {...DEFAULT_CFG}; }
}
async function saveConfig(newCfg){
  cfg = newCfg;
  try{ await storageSet(CFG_KEY, JSON.stringify(cfg)); return true; }
  catch(e){ showToast('Не вдалося зберегти налаштування. Перевірте зʼєднання і спробуйте ще раз.', true); return false; }
}
async function saveResult(id, P, s){
  try{
    await storageSet(RESULTS_PREFIX+id, JSON.stringify({ id, group:studentGroup, params:P, derived:s.derived, ts: Date.now() }));
    return true;
  }catch(e){
    showToast('Не вдалося зберегти результат вимірювання. Спробуйте «Почати вимірювання» ще раз.', true);
    return false;
  }
}
async function saveAnswer(id, values){
  try{
    await storageSet(ANSWERS_PREFIX+id, JSON.stringify({ id, values, submittedAt: Date.now() }));
    return true;
  }catch(e){
    showToast('Не вдалося надіслати відповідь. Спробуйте ще раз.', true);
    return false;
  }
}
// надсилання відповіді + еталонних значень у Google Таблицю викладача (Apps Script Web App)
async function sendToSheet(ansValues){
  if (!cfg.endpoint) return; // не налаштовано — мовчки пропускаємо, локальне збереження вище вже відпрацювало
  const ctx = answerCtx();
  const payload = { key: SHEET_KEY, studentId, group: studentGroup };
  TASK.answerFields.forEach(f=>{
    const applicable = !f.showIf || f.showIf(ctx);
    payload[f.id+'_ref'] = applicable ? f.ref(ctx) : null;
    const av = ansValues[f.id];
    payload[f.id+'_ans'] = (av==null || isNaN(av)) ? null : av;
  });
  try{
    // Apps Script Web App не повертає CORS-заголовків, тому відповідь непрозора
    // (mode:'no-cors') — можна підтвердити лише факт відправки, не успіх на сервері.
    // keepalive:true — щоб запит не обірвався, якщо студент одразу закриє
    // вкладку чи перейде на іншу сторінку відразу після натискання кнопки.
    await fetch(cfg.endpoint, {
      method:'POST', mode:'no-cors', keepalive:true,
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
    showToast('Результат надіслано у таблицю викладача.', false);
  }catch(e){
    showToast('Не вдалося з’єднатися з таблицею викладача. Відповідь збережено локально — повідомте викладача.', true);
  }
}
async function loadAnswer(id){
  try{ const r = await storageGet(ANSWERS_PREFIX+id); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function loadAllResults(){
  try{
    const list = await storageList(RESULTS_PREFIX);
    if (!list || !list.keys) return [];
    const out = [];
    for(const k of list.keys){
      try{ const r = await storageGet(k); if (r) out.push(JSON.parse(r.value)); }catch(e){}
    }
    for(const item of out){ item.answer = await loadAnswer(item.id); }
    return out.sort((a,b)=> (a.group||'').localeCompare(b.group||'') || a.id.localeCompare(b.id));
  }catch(e){ return []; }
}

// приймає і "," і "." як десятковий роздільник (типова плутанина для укр. локалі)
function parseNum(str){
  if (str==null) return NaN;
  return parseFloat(String(str).trim().replace(',', '.'));
}

// ---------- niceNum для поділок осей ----------
function niceNum(range, round){
  const exp = Math.floor(Math.log10(range));
  const f = range/Math.pow(10,exp);
  let nf;
  if (round){
    if (f<1.5) nf=1; else if (f<3) nf=2; else if (f<7) nf=5; else nf=10;
  } else {
    if (f<=1) nf=1; else if (f<=2) nf=2; else if (f<=5) nf=5; else nf=10;
  }
  return nf*Math.pow(10,exp);
}

// ---------- малювання (повністю узагальнене: два числові масиви, без прив'язки до сенсу) ----------
function drawPanel(canvas, xArr, yArr, opts){
  const W = canvas.width, H = canvas.height;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = "#f0f0f0";
  ctx.fillRect(0,0,W,H);

  const padL=48, padR=14, padT=14, padB=26;
  const plotW = W-padL-padR, plotH = H-padT-padB;

  const lo = opts.lo ?? 0, hi = opts.hi ?? (xArr.length-1);
  const xMin = xArr[lo], xMaxV = xArr[hi];
  const xSpan = (xMaxV-xMin) || 1;

  let yMax = 0;
  for(let i=lo;i<=hi;i++){ const a=Math.abs(yArr[i]); if(a>yMax) yMax=a; }
  yMax *= 1.15;
  if (yMax===0) yMax=1;

  const xToPx = v => padL + ((v-xMin)/xSpan)*plotW;
  const yToPx = v => padT + plotH/2 - (v/yMax)*(plotH/2);

  ctx.strokeStyle = "#d3d3d3"; ctx.lineWidth=1;
  ctx.font = "10px Tahoma"; ctx.fillStyle="#555";
  const xStep = niceNum(xSpan/10, true);
  const xStart = Math.ceil(xMin/xStep)*xStep;
  for(let xv=xStart; xv<=xMaxV+1e-9; xv+=xStep){
    const x = xToPx(xv);
    ctx.beginPath(); ctx.moveTo(x,padT); ctx.lineTo(x,H-padB); ctx.stroke();
    ctx.fillText(xv.toFixed(xStep<0.01?4:(xStep<0.1?3:2)), x-10, H-padB+14);
  }
  const yStep = niceNum(yMax/6, true);
  for(let yv=-Math.ceil(yMax/yStep)*yStep; yv<=yMax; yv+=yStep){
    const y = yToPx(yv);
    if (y<padT-2 || y>H-padB+2) continue;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.fillText(yv.toFixed(Math.abs(yv)<10?1:0), 4, y+3);
  }
  ctx.strokeStyle="#333"; ctx.lineWidth=1.2;
  const y0 = yToPx(0);
  ctx.beginPath(); ctx.moveTo(padL,y0); ctx.lineTo(W-padR,y0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(padL,padT); ctx.lineTo(padL,H-padB); ctx.stroke();

  ctx.strokeStyle = opts.color; ctx.lineWidth = 1.6;
  ctx.beginPath();
  for(let i=lo;i<=hi;i++){
    const x = xToPx(xArr[i]), y = yToPx(yArr[i]);
    if (i===lo) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();

  ctx.fillStyle = "#00000090";
  pinned.forEach(p=>{
    if (p.idx<lo || p.idx>hi) return;
    const x = xToPx(xArr[p.idx]), y = yToPx(yArr[p.idx]);
    ctx.beginPath(); ctx.arc(x,y,3.2,0,7); ctx.fill();
  });

  if (cursorIdx!=null && cursorIdx>=lo && cursorIdx<=hi){
    const x = xToPx(xArr[cursorIdx]), y = yToPx(yArr[cursorIdx]);
    ctx.strokeStyle = "#4466cc88"; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x,padT); ctx.lineTo(x,H-padB); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.fillStyle = opts.color;
    ctx.beginPath(); ctx.arc(x,y,3.5,0,7); ctx.fill();
  }

  if (opts.dragSel){
    const x1v = xArr[opts.dragSel.a], x2v = xArr[opts.dragSel.b];
    const x1 = xToPx(Math.min(x1v,x2v)), x2 = xToPx(Math.max(x1v,x2v));
    ctx.fillStyle = "rgba(50,110,220,0.15)";
    ctx.fillRect(x1, padT, x2-x1, plotH);
    ctx.strokeStyle = "rgba(50,110,220,0.6)"; ctx.lineWidth=1;
    ctx.strokeRect(x1, padT, x2-x1, plotH);
  }

  return {padL,padR,padT,padB,plotW,plotH,xMin,xMaxV,yMax,xToPx,yToPx};
}

// ---------- зум (спільний для всіх панелей — той самий діапазон індексів) ----------
let zoomLo = 0, zoomHi = null;
let dragging = false, dragStartIdx = null, dragCurIdx = null, dragStartClientX = null;

function zoomRange(){
  if (!sim) return [0,0];
  return zoomHi!=null ? [zoomLo, zoomHi] : [0, sim.t.length-1];
}
function resetZoom(){ zoomLo = 0; zoomHi = null; redraw(); }
function pixelToIdx(canvas, clientX){
  const rect = canvas.getBoundingClientRect();
  const xRatio = (clientX-rect.left)/rect.width;
  const padL=48/1600, padR=14/1600;
  const usable = 1-padL-padR;
  let frac = (xRatio-padL)/usable;
  frac = Math.min(1, Math.max(0, frac));
  const [lo,hi] = zoomRange();
  return Math.round(lo + frac*(hi-lo));
}

function fmtNum(v){
  if (v==null || isNaN(v)) return '—';
  const a = Math.abs(v);
  return v.toFixed(a<1?4:(a<100?2:1));
}

function attachCanvasEvents(canvas){
  function handlePos(clientX){
    if (!sim) return;
    cursorIdx = pixelToIdx(canvas, clientX);
    redraw();
  }
  canvas.addEventListener('mousemove', e=>{
    if (dragging){ dragCurIdx = pixelToIdx(canvas, e.clientX); redraw(); }
    else handlePos(e.clientX);
  });
  canvas.addEventListener('mouseleave', ()=>{ if (!dragging){ cursorIdx=null; redraw(); } });
  canvas.addEventListener('mousedown', e=>{
    if (!sim) return;
    e.preventDefault();
    dragging = true;
    dragStartIdx = pixelToIdx(canvas, e.clientX);
    dragCurIdx = dragStartIdx;
    dragStartClientX = e.clientX;
  });
  canvas.addEventListener('dblclick', ()=>{ if (sim) resetZoom(); });

  let lastTapTime = 0;
  canvas.addEventListener('touchstart', e=>{
    if (!sim) return;
    e.preventDefault();
    const touch = e.touches[0];
    if (!touch) return;
    const now = Date.now();
    if (now - lastTapTime < 350){
      dragging = false; dragStartIdx=null; dragCurIdx=null;
      resetZoom();
      lastTapTime = 0;
      return;
    }
    lastTapTime = now;
    dragging = true;
    dragStartIdx = pixelToIdx(canvas, touch.clientX);
    dragCurIdx = dragStartIdx;
    dragStartClientX = touch.clientX;
  }, {passive:false});
  canvas.addEventListener('touchmove', e=>{
    e.preventDefault();
    if (!sim || !e.touches[0]) return;
    if (dragging){ dragCurIdx = pixelToIdx(canvas, e.touches[0].clientX); redraw(); }
    else handlePos(e.touches[0].clientX);
  }, {passive:false});
}

function finishDrag(clientX){
  if (!dragging) return;
  dragging = false;
  if (!sim){ dragStartIdx=null; dragCurIdx=null; return; }
  const pixelDist = Math.abs(clientX - dragStartClientX);
  if (pixelDist < 5){
    cursorIdx = dragStartIdx;
    pinned.push({idx: cursorIdx});
    renderPointsTable();
  } else if (dragStartIdx!=null && dragCurIdx!=null && dragStartIdx!==dragCurIdx){
    let lo = Math.min(dragStartIdx, dragCurIdx), hi = Math.max(dragStartIdx, dragCurIdx);
    if (hi-lo < 4) hi = Math.min(sim.t.length-1, lo+4);
    zoomLo = lo; zoomHi = hi;
  }
  dragStartIdx = null; dragCurIdx = null;
  redraw();
}

let globalMouseUpAttached = false;
function attachGlobalMouseUp(){
  if (globalMouseUpAttached) return;
  globalMouseUpAttached = true;
  window.addEventListener('mouseup', e=> finishDrag(e.clientX));
  window.addEventListener('touchend', e=>{
    const t = e.changedTouches && e.changedTouches[0];
    finishDrag(t ? t.clientX : dragStartClientX);
  });
  window.addEventListener('touchcancel', ()=>{ dragging=false; dragStartIdx=null; dragCurIdx=null; });
}

function redraw(){
  if (!sim){
    els.panels && els.panels.forEach(p=>{
      const c = p.canvas, ctx = c.getContext('2d');
      ctx.fillStyle="#f0f0f0"; ctx.fillRect(0,0,c.width,c.height);
      ctx.fillStyle="#888"; ctx.font="16px Tahoma";
      ctx.fillText("Введіть ідентифікатор і натисніть «Почати вимірювання»", 30, c.height/2);
    });
    return;
  }
  const [lo,hi] = zoomRange();
  const dragSel = (dragging && dragStartIdx!=null && dragCurIdx!=null && dragStartIdx!==dragCurIdx)
    ? {a:dragStartIdx, b:dragCurIdx} : null;

  els.panels.forEach(p=>{
    const def = p.def;
    const xScale = def.xScale||1, yScale = def.yScale||1;
    const xArr = sim.series[def.x].map(v=>v*xScale);
    const yArr = sim.series[def.y].map(v=>v*yScale);
    drawPanel(p.canvas, xArr, yArr, {color:def.color, lo, hi, dragSel});
    if (cursorIdx!=null){
      p.readout.innerHTML = `${def.yLabel}: ${yArr[cursorIdx].toFixed(def.yDecimals??2)} ${def.yUnit};&nbsp;&nbsp;&nbsp;&nbsp;${def.xLabel}: ${xArr[cursorIdx].toFixed(def.xDecimals??4)} ${def.xUnit}`;
    } else {
      p.readout.innerHTML = `${def.yLabel}: —&nbsp;${def.yUnit};&nbsp;&nbsp;&nbsp;&nbsp;${def.xLabel}: — ${def.xUnit}`;
    }
  });

  if (els.zoomTag) els.zoomTag.style.display = (zoomHi!=null) ? 'inline' : 'none';
  renderPointsTable();
  // ВАЖЛИВО: renderAnswerPanel() навмисно НЕ викликається тут — інакше кожен рух
  // курсора по графіку перебудовує поля вводу й стирає вже введені відповіді.
  // Її викликають лише render() (один раз при старті/перемиканні панелі) та onStart().
}

function seriesIds(){
  return Object.keys(sim.series);
}

function renderPointsTable(){
  const ids = seriesIds();
  els.ptsHeadRow.innerHTML = '<th>#</th>' + ids.map(id=>{
    const m = seriesMeta(id);
    return `<th>${m.label}${m.unit?', '+m.unit:''}</th>`;
  }).join('');
  els.ptsBody.innerHTML = pinned.map((p,i)=>{
    const cells = ids.map(id=>{
      const m = seriesMeta(id);
      const v = sim.series[id][p.idx]*m.scale;
      return `<td>${v.toFixed(m.decimals)}</td>`;
    }).join('');
    return `<tr><td>${i+1}</td>${cells}</tr>`;
  }).join('');
}

function copyPointsTable(){
  if (!sim || !pinned.length){ return; }
  const ids = seriesIds();
  const header = ids.map(id=>{ const m=seriesMeta(id); return `${m.label}${m.unit?', '+m.unit:''}`; }).join("\t")+"\n";
  const body = pinned.map(p=> ids.map(id=>{
    const m = seriesMeta(id);
    return (sim.series[id][p.idx]*m.scale).toFixed(m.decimals);
  }).join("\t")).join("\n");
  const text = header+body;
  navigator.clipboard?.writeText(text).catch(()=>{
    const ta = document.createElement('textarea');
    ta.value=text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
  });
}

async function onStart(){
  const id = els.studentId.value.trim();
  if (!id){ alert("Введіть ідентифікатор (ПІБ або код студента)."); return; }
  studentId = id;
  studentGroup = els.groupId.value.trim();
  const r = runSimulation(id);
  params = r.P;
  sim = r.sim;
  pinned = [];
  cursorIdx = null;
  zoomLo = 0; zoomHi = null;
  redraw();
  renderAnswerPanel();
  const ok = await saveResult(id, params, sim);
  if (ok) showToast('Вимірювання розпочато.', false);
}

// ---------- звірка однієї відповіді: відсоткова або кутова (isAngle) ----------
function checkOneField(f, val, ref){
  if (isNaN(val)) return {ok:false, text:`${f.label.split(',')[0]}: не вказано`};
  if (f.isAngle){
    const d = angDiff(val, ref);
    const tol = f.angleTolDeg ?? cfg.phaseTol ?? 10;
    const ok = d<=tol;
    return {ok, text:`${f.label.split(',')[0]}: ${val}° ${ok?'✅':'❌'} (розбіжність ${d.toFixed(0)}°, допуск ±${tol}°)`};
  }
  const err = Math.abs(val-ref)/Math.abs(ref)*100;
  const ok = err <= (f.tolerancePct ?? 15);
  return {ok, text:`${f.label.split(',')[0]}: ${val} ${f.unit||''} ${ok?'✅':'❌'} (розбіжність ~${err.toFixed(0)}%)`};
}

function renderAnswerPanel(){
  const box = document.getElementById('answerPanel');
  if (!box) return;
  if (!sim){ box.innerHTML = ""; return; }
  const ctx = answerCtx();
  const visibleFields = TASK.answerFields.filter(f=>!f.showIf || f.showIf(ctx));
  box.innerHTML = `
    <b style="font-size:13px;">Ваша відповідь</b>
    <div class="row2">
      ${visibleFields.map(f=>`<div><label>${f.label}</label><input id="ans_${f.id}" type="text" placeholder="${f.placeholder||''}"></div>`).join('')}
    </div>
    <button class="btn" id="submitAns">Надіслати відповідь</button>
    <div id="ansFeedback" style="margin-top:8px;font-size:13px;"></div>
  `;
  document.getElementById('submitAns').onclick = async ()=>{
    const ansValues = {};
    visibleFields.forEach(f=>{ ansValues[f.id] = parseNum(document.getElementById('ans_'+f.id).value); });
    if (!studentId){ alert("Спершу почніть вимірювання."); return; }
    const ok = await saveAnswer(studentId, ansValues);
    await sendToSheet(ansValues);
    const fb = document.getElementById('ansFeedback');
    const rows = visibleFields.map(f=>{
      const r = checkOneField(f, ansValues[f.id], f.ref(ctx));
      return `<div style="color:${r.ok?'#0a7a1f':'#b30000'};">${r.text}</div>`;
    });
    fb.innerHTML = rows.join('') + (ok
      ? `<div class="small" style="margin-top:4px;">Відповідь надіслано і збережено для викладача.</div>`
      : `<div class="small" style="margin-top:4px;color:#b30000;">Увага: відповідь НЕ збережено через помилку зʼєднання. Натисніть «Надіслати відповідь» ще раз.</div>`);
  };
}

              const ref = applicable ? f.ref(ctx) : null;
              const ans = r.answer?.values?.[f.id];
              return `<td>${ref!=null?fmtNum(ref):'—'}</td><td>${applicable?fmtAns(f, ans, ref):'—'}</td>`;
            }).join('');
            return `<tr><td>${r.group||''}</td><td>${r.id}</td>${cells}</tr>`;
          }).join('')}
        </tbody>
      </table>`;
  };
}

// ---------- init ----------
(async function init(){
  document.title = TASK.title;
  attachGlobalMouseUp();
  await loadConfig();
  render();
})();

})();
</script>
</body>
