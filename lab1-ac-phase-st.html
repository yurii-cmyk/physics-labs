<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physics trainer</title>
</head>
<body>
<style>
/* ---------- PHASOR VIEW (task-specific, not part of ENGINE) ---------- */
#phasorView, #phasorView *{ box-sizing:border-box; font-family:"Segoe UI", Tahoma, Arial, sans-serif; }
#phasorView{ background:#d9d9d9; padding:14px; border-radius:6px; color:#111; margin-bottom:12px; }
#phasorView .pv-frame{ background:#fff; border:1px solid #8a8a8a; box-shadow:1px 1px 4px rgba(0,0,0,.25); }
#pvCanvas{ display:block; width:100%; height:auto; cursor:default; touch-action:auto; }
#phasorView .pv-row{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 18px; margin-top:10px; font-size:13px; }
#phasorView .pv-group{ display:flex; align-items:center; gap:6px; }
#phasorView input[type=range]{ width:140px; }
#phasorView #pvT{ width:220px; }
#phasorView .pv-val{ min-width:52px; font-variant-numeric:tabular-nums; }
#phasorView select{ padding:4px 6px; border:1px solid #999; border-radius:3px; font-size:13px; }
.pv-section{ font-family:"Segoe UI", Tahoma, Arial, sans-serif; font-size:13px; font-weight:600; color:#333; margin:4px 2px 8px; }
</style>

<div id="phasorView">
  <div class="pv-frame"><canvas id="pvCanvas" width="1920" height="1080"></canvas></div>
  <div class="pv-row">
    <button class="btn" id="pvPlay">▶ Play</button>
    <button class="btn" id="pvStep">Step ▸</button>
    <button class="btn" id="pvReset">⟲ Reset</button>
    <span class="pv-group"><span><i>t</i></span> <input type="range" id="pvT" min="0" max="1000" step="1" value="0"></span>
    <span class="pv-group">Slow motion
      <select id="pvSpeed">
        <option value="100">×100</option>
        <option value="200" selected>×200</option>
        <option value="500">×500</option>
        <option value="1000">×1000</option>
      </select>
    </span>
  </div>
  <div class="pv-row" id="pvParams"></div>
</div>
<div class="pv-section">Individual assignment — measure your own signal</div>

<script>
/* ==========================================================================
   PHASOR VIEW — task-specific demonstration module for this lab only
   (spec: phasor_diagram_web_spec.md). NOT part of ENGINE and does not touch
   engine state: it has its own parameters (sliders), so it never reveals a
   student's individual variant. Everything is drawn in reference
   coordinates 1920×1080; CSS scales the canvas to the page width.
   ========================================================================== */
(function(){
const C = {x:330, y:560}, R = 260;
const GX0 = 730, GW = 1100, GX1 = GX0+GW, GY0 = 560, GTOP = GY0-350, GBOT = GY0+300;

const COL = {U:'#2563EB', Text:'#111111', Tick:'#222222', Num:'#6B3E1F', Axis:'#4B5563',
             Aux:'#9CA3AF', Grid:'#D9DCE1', GridMinor:'#E6E8EB', Field:'#F0F0F0', White:'#FFFFFF'};
function hex2rgb(h){ return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16)); }
function mix(a,b,k){ const A=hex2rgb(a), B=hex2rgb(b); return 'rgb('+A.map((v,i)=>Math.round(k*v+(1-k)*B[i])).join(',')+')'; }
COL.Ucross = mix(COL.U, COL.Field, 0.55);
COL.Uproj  = mix(COL.U, COL.White, 0.75);

const SANS  = '"Segoe UI", Tahoma, Arial, sans-serif';
const SERIF = '"Cambria", "STIX Two Text", "Times New Roman", serif';
const fsSans  = cap => cap/0.70;   // cap height → font-size (Segoe UI)
const fsSerif = cap => cap/0.667;  // cap height → font-size (Cambria)

const MINUS = '−';
function fmt(v,d){ const a=Math.abs(v).toFixed(d); return (v<0 && parseFloat(a)!==0 ? MINUS : '')+a; }

// ---------- state ----------
const P = {f:50, Um:8, phi:30, n:2};
let t = 0, playing = false, slow = 200, dirty = true;

function D(){
  const omega = 2*Math.PI*P.f;
  return {omega, T:1/P.f, phi0:P.phi*Math.PI/180, tw:P.n/P.f};
}

// ---------- rich text: [{s, it, sub, c}] ----------
const I = (s,c)=>({s, it:true, c});
const N = (s,c)=>({s, c});
const S = (s,c)=>({s, sub:true, c});
function segFont(g,size,fam){ return (g.it?'italic ':'')+(g.sub?size*0.68:size).toFixed(1)+'px '+fam; }
function richWidth(ctx,segs,size,fam){ let w=0; for(const g of segs){ ctx.font=segFont(g,size,fam); w+=ctx.measureText(g.s).width; } return w; }
function drawRich(ctx,segs,x,y,o){ // y = baseline
  const fam=o.fam, size=o.size;
  const w = richWidth(ctx,segs,size,fam);
  let cx = o.align==='center' ? x-w/2 : (o.align==='right' ? x-w : x);
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  for(const g of segs){
    ctx.font = segFont(g,size,fam);
    const gy = g.sub ? y+size*0.22 : y;
    if (o.halo){ ctx.lineWidth=o.haloW||2; ctx.lineJoin='round'; ctx.strokeStyle=COL.White; ctx.strokeText(g.s,cx,gy); }
    ctx.fillStyle = g.c || o.color || COL.Text;
    ctx.fillText(g.s,cx,gy);
    cx += ctx.measureText(g.s).width;
  }
  return w;
}

// ---------- line / arrow helpers ----------
function line(ctx,x1,y1,x2,y2,color,w,dash){
  ctx.strokeStyle=color; ctx.lineWidth=w; ctx.setLineDash(dash||[]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.setLineDash([]);
}
function head(ctx,tx,ty,dx,dy,len,wid,color){ // tip at (tx,ty), unit direction (dx,dy)
  const bx=tx-dx*len, by=ty-dy*len, px=-dy*wid/2, py=dx*wid/2;
  ctx.fillStyle=color; ctx.beginPath();
  ctx.moveTo(tx,ty); ctx.lineTo(bx+px,by+py); ctx.lineTo(bx-px,by-py); ctx.closePath(); ctx.fill();
}
function arrow(ctx,x1,y1,x2,y2,color,w,len,wid){
  const L=Math.hypot(x2-x1,y2-y1); if (L<1e-6) return;
  const dx=(x2-x1)/L, dy=(y2-y1)/L;
  line(ctx,x1,y1,x2-dx*len*0.8,y2-dy*len*0.8,color,w);
  head(ctx,x2,y2,dx,dy,len,wid,color);
}
function dblArrow(ctx,x1,y1,x2,y2,color,w,len,wid){
  const L=Math.hypot(x2-x1,y2-y1); if (L<1e-6) return;
  const dx=(x2-x1)/L, dy=(y2-y1)/L;
  line(ctx,x1+dx*len*0.8,y1+dy*len*0.8,x2-dx*len*0.8,y2-dy*len*0.8,color,w);
  head(ctx,x2,y2,dx,dy,len,wid,color); head(ctx,x1,y1,-dx,-dy,len,wid,color);
}

// ---------- scales ----------
function timeStep(tw){
  const c=[0.001,0.002,0.005,0.01,0.02];
  for(const s of c){ const k=tw/s; if (k>=6-1e-9 && k<=10+1e-9) return s; }
  let best=c[0]; for(const s of c) if (Math.abs(tw/s-8)<Math.abs(tw/best-8)) best=s;
  return best;
}
function voltStep(){ return P.Um<=6 ? {major:1, minor:0.5} : {major:2, minor:1}; }

// ---------- drawing ----------
function draw(){
  const cv = document.getElementById('pvCanvas');
  const ctx = cv.getContext('2d');
  const d = D();
  const th = d.omega*t + d.phi0;
  const u = P.Um*Math.sin(th);
  const k = R/P.Um;                         // px per volt: Um ↔ R
  const xOf = tt => GX0 + tt/d.tw*GW;
  const yOf = uu => GY0 - uu*k;
  const tip = {x:C.x+R*Math.cos(th), y:C.y-R*Math.sin(th)};
  const atStart = t<=0;
  const showPhase = !(atStart && P.phi===0);

  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle=COL.White; ctx.fillRect(0,0,1920,1080);

  // title
  drawRich(ctx,[N('Phase of alternating voltage')],960,78,{fam:SANS,size:fsSans(37.5),align:'center'});

  // ===== graph =====
  ctx.fillStyle=COL.Field; ctx.fillRect(GX0,GTOP,GW,GBOT-GTOP);
  const vs = voltStep(), uMax=(GY0-GTOP)/k, uMin=-(GBOT-GY0)/k;
  for(let v=Math.ceil(uMin/vs.minor)*vs.minor; v<=uMax+1e-9; v+=vs.minor){
    const isMajor = Math.abs(v/vs.major-Math.round(v/vs.major))<1e-6;
    if (!isMajor) line(ctx,GX0,yOf(v),GX1,yOf(v),COL.GridMinor,1.1);
  }
  const ts = timeStep(d.tw);
  for(let i=1; i*ts<=d.tw+1e-12; i++) line(ctx,xOf(i*ts),GTOP,xOf(i*ts),GBOT,COL.Grid,1.5);
  for(let v=Math.ceil(uMin/vs.major)*vs.major; v<=uMax+1e-9; v+=vs.major){
    if (Math.abs(v)>1e-9) line(ctx,GX0,yOf(v),GX1,yOf(v),COL.Grid,1.5);
  }
  // scale labels
  const fsTick = fsSans(16.5);
  // voltage labels are drawn later (after the projection line), with a white halo
  const voltLabels = ()=>{ for(let v=Math.ceil(uMin/vs.major)*vs.major; v<=uMax+1e-9; v+=vs.major){
    drawRich(ctx,[N(fmt(Math.round(v),0),COL.Tick)],GX0-12,yOf(v)+8,{fam:SANS,size:fsTick,align:'right',halo:true,haloW:6});
  } };
  for(let i=0; i*ts<=d.tw+1e-12; i++){
    drawRich(ctx,[N(i===0?'0':(i*ts).toFixed(3),COL.Tick)],xOf(i*ts),GBOT+10+16.5,{fam:SANS,size:fsTick,align:'center'});
  }
  // axes
  line(ctx,GX0,GTOP,GX0,GBOT,COL.Axis,2.8);
  line(ctx,GX0,GY0,GX1,GY0,COL.Axis,2.8);
  drawRich(ctx,[I('U'),N(', V')],GX0+12,GTOP+12+16.5,{fam:SANS,size:fsTick});
  drawRich(ctx,[I('t'),N(', s')],GX1-12,GY0-12,{fam:SANS,size:fsTick,align:'right'});

  // instrument header
  const fsHead = fsSans(21);
  ctx.fillStyle=COL.U; ctx.fillRect(GX0,154,22,22);
  let hx = GX0+34;
  hx += drawRich(ctx,[N('[Input 1] Voltmeter')],hx,176,{fam:SANS,size:fsHead});
  drawRich(ctx,[N(' — Voltage: '+fmt(u,2)+' V; Time: '+t.toFixed(4)+' s',COL.U)],hx,176,{fam:SANS,size:fsHead});

  // cursor crosshair (under the curve)
  const cx = xOf(t), cy = yOf(u);
  line(ctx,cx,GTOP,cx,GBOT,COL.Ucross,1.8);
  line(ctx,GX0,cy,GX1,cy,COL.Ucross,1.8);

  // curve from 0 to current t
  ctx.save(); ctx.beginPath(); ctx.rect(GX0,GTOP,GW,GBOT-GTOP); ctx.clip();
  ctx.strokeStyle=COL.U; ctx.lineWidth=5; ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.beginPath();
  const M=900;
  ctx.moveTo(xOf(0), yOf(P.Um*Math.sin(d.phi0)));
  for(let i=1;i<=M;i++){
    const ti=i*d.tw/M; if (ti>=t) break;
    ctx.lineTo(xOf(ti), yOf(P.Um*Math.sin(d.omega*ti+d.phi0)));
  }
  ctx.lineTo(cx,cy);
  ctx.stroke(); ctx.restore();

  // amplitude and period annotations
  const fsSym = fsSerif(27);
  const t1 = (((Math.PI/2-d.phi0)%(2*Math.PI))+2*Math.PI)%(2*Math.PI)/d.omega;
  if (t>=t1-1e-12 && t1<=d.tw+1e-12){
    const xa=xOf(t1);
    dblArrow(ctx,xa,GY0,xa,GY0-R,COL.Text,2.5,22,16);
    drawRich(ctx,[I('U'),S('m')],xa+14,GY0-R/2+13.5,{fam:SERIF,size:fsSym,halo:true});
    const t2 = t1+d.T;
    if (t>=t2-1e-12 && t2<=d.tw+1e-12){
      const xb=xOf(t2), ya=GY0-R-38;
      line(ctx,xa,GY0-R-6,xa,ya-14,COL.Text,2.5);
      line(ctx,xb,GY0-R-6,xb,ya-14,COL.Text,2.5);
      dblArrow(ctx,xa,ya,xb,ya,COL.Text,2.5,22,16);
      drawRich(ctx,[I('T')],(xa+xb)/2,ya-10,{fam:SERIF,size:fsSym,align:'center',halo:true});
    }
  }
  // cursor point
  ctx.fillStyle=COL.U; ctx.beginPath(); ctx.arc(cx,cy,8.5,0,2*Math.PI); ctx.fill();

  // ===== phasor diagram =====
  ctx.strokeStyle=COL.Aux; ctx.lineWidth=3.5;
  ctx.beginPath(); ctx.arc(C.x,C.y,R,0,2*Math.PI); ctx.stroke();
  for(let a=0;a<360;a+=15){
    const r=a*Math.PI/180, c=Math.cos(r), s=Math.sin(r);
    line(ctx,C.x+(R-14)*c,C.y-(R-14)*s,C.x+R*c,C.y-R*s,COL.Aux,2.8);
  }
  line(ctx,C.x-R-25,C.y,C.x+R+25,C.y,COL.Axis,3);
  line(ctx,C.x,C.y-R-25,C.x,C.y+R+25,COL.Axis,3);
  const fsAng = fsSerif(25);
  drawRich(ctx,[N('0')],C.x+R+25+12,C.y+12.5,{fam:SERIF,size:fsAng});
  drawRich(ctx,[N('π/2')],C.x,C.y-R-25-12,{fam:SERIF,size:fsAng,align:'center'});
  drawRich(ctx,[N('π')],C.x-R-25-12,C.y+12.5,{fam:SERIF,size:fsAng,align:'right'});
  drawRich(ctx,[N('3π/2')],C.x,C.y+R+25+12+25,{fam:SERIF,size:fsAng,align:'center'});

  // direction of rotation ω (outside the circle, over the 1st quadrant)
  {
    const rr=R+75, a0=58*Math.PI/180, a1=78*Math.PI/180, hl=24;
    ctx.strokeStyle=COL.Text; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(C.x,C.y,rr,-a0,-(a1-0.8*hl/rr),true); ctx.stroke();
    head(ctx,C.x+rr*Math.cos(a1),C.y-rr*Math.sin(a1),-Math.sin(a1),-Math.cos(a1),hl,19,COL.Text);
    const al=64*Math.PI/180;
    drawRich(ctx,[I('ω')],C.x+(R+105)*Math.cos(al),C.y-(R+105)*Math.sin(al)+13.5,{fam:SERIF,size:fsSym,align:'center'});
  }

  if (showPhase){
    // ghost of the vector at t = 0
    line(ctx,C.x,C.y,C.x+R*Math.cos(d.phi0),C.y-R*Math.sin(d.phi0),COL.Uproj,2.2,[12,9]);
    // phase arc (within one revolution)
    const thm = ((th%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
    if (thm>1e-9){
      ctx.strokeStyle=COL.Text; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.arc(C.x,C.y,80,0,-thm,true); ctx.stroke();
    }
  }
  // projection dashed line: from the vector tip to the graph field
  line(ctx,tip.x,tip.y,GX0,tip.y,COL.Uproj,2.2,[12,9]);
  voltLabels();
  // projection vector along the vertical axis
  const L = Math.abs(tip.y-C.y);
  if (L>=1) arrow(ctx,C.x,C.y,C.x,tip.y,COL.U,5,Math.min(26,0.6*L),Math.min(20,0.46*L));
  // main vector Um
  arrow(ctx,C.x,C.y,tip.x,tip.y,COL.U,7,34,26);
  // Um label beside the vector, on the side opposite the projection line
  {
    const sg = Math.sign(Math.sin(th)*Math.cos(th)) || 1;
    const psi = th - sg*Math.PI/2;
    const lx = C.x+0.72*R*Math.cos(th)+36*Math.cos(psi);
    const ly = C.y-0.72*R*Math.sin(th)-36*Math.sin(psi);
    drawRich(ctx,[I('U',COL.U),S('m',COL.U)],lx,ly+15,{fam:SERIF,size:fsSerif(30),align:'center',halo:true});
  }
  // fixed angle mark φ0 / φ (top layer, white halo)
  if (showPhase){
    const segs = atStart ? [I('φ'),S('0')] : [I('φ')];
    drawRich(ctx,segs,C.x+95,C.y-13,{fam:SERIF,size:fsSym,halo:true});
  }

  // ===== parameter block =====
  const G = '  ';
  drawRich(ctx,[
    I('U'),S('m'),N(' = '+P.Um.toFixed(1)+' V'+G),
    I('T'),N(' = '+d.T.toFixed(3)+' s'+G),
    I('f'),N(' = 1/'),I('T'),N(' = '+P.f.toFixed(0)+' Hz'+G),
    I('ω'),N(' = 2π'),I('f'),N(' = '+d.omega.toFixed(0)+' rad/s'+G),
    I('φ'),S('0'),N(' = '+d.phi0.toFixed(2)+' rad ('+P.phi.toFixed(0)+'°)')
  ],960,963,{fam:SERIF,size:fsSerif(22),align:'center'});

  // ===== calculation line =====
  const ph = th, phDeg = th*180/Math.PI, um = P.Um.toFixed(1);
  const line2 = [
    I('u',COL.U),N(' = '),I('U'),S('m'),N(' sin('),I('ω'),I('t'),N(' + '),I('φ'),S('0'),N(') = '),
    N(um+' · sin('+d.omega.toFixed(0)+' · '),N(t.toFixed(4),COL.Num),N(' + '+d.phi0.toFixed(2)+') = '),
    N(um+' · sin('),N(fmt(ph,2),COL.Num),N(' rad) = '),
    N(um+' · sin('),N(fmt(phDeg,0)+'°',COL.Num),N(') = '),
    N(fmt(u,2),COL.Num),N(' V')
  ];
  let fsCalc = fsSerif(23.5);
  const wCalc = richWidth(ctx,line2,fsCalc,SERIF);
  if (wCalc>1880) fsCalc *= 1880/wCalc;
  drawRich(ctx,line2,960,1040,{fam:SERIF,size:fsCalc,align:'center'});
}

// ---------- controls ----------
const SLIDERS = [
  {id:'f',   html:'<i>f</i>, Hz',             min:50,   max:100, step:1,    dec:0},
  {id:'Um',  html:'<i>U</i><sub>m</sub>, V',  min:5,    max:10,  step:0.1,  dec:1},
  {id:'phi', html:'<i>φ</i><sub>0</sub>, °',  min:0,    max:359, step:1,    dec:0},
  {id:'n',   html:'periods <i>n</i>',         min:1.75, max:4,   step:0.25, dec:2}
];
const $ = id => document.getElementById(id);

function syncT(){ const tw=D().tw; $('pvT').value = Math.round(t/tw*1000); }
function setPlay(v){ playing=v; $('pvPlay').textContent = playing ? '❚❚ Pause' : '▶ Play'; }

function initControls(){
  $('pvParams').innerHTML = SLIDERS.map(s=>`
    <span class="pv-group"><span>${s.html}</span>
      <input type="range" id="pv_${s.id}" min="${s.min}" max="${s.max}" step="${s.step}" value="${P[s.id]}">
      <span class="pv-val" id="pvv_${s.id}">${P[s.id].toFixed(s.dec)}</span>
    </span>`).join('');
  SLIDERS.forEach(s=>{
    $('pv_'+s.id).oninput = e=>{
      P[s.id] = parseFloat(e.target.value);
      $('pvv_'+s.id).textContent = P[s.id].toFixed(s.dec);
      t = Math.min(t, D().tw);
      syncT(); dirty = true;
    };
  });
  $('pvPlay').onclick = ()=>{
    if (!playing && t>=D().tw-1e-12) t = 0;
    setPlay(!playing); dirty = true;
  };
  $('pvStep').onclick = ()=>{
    setPlay(false);
    const d=D(); t = Math.min(d.tw, t + d.T/72);   // one step = 5° of phase
    syncT(); dirty = true;
  };
  $('pvReset').onclick = ()=>{ setPlay(false); t = 0; syncT(); dirty = true; };
  $('pvT').oninput = e=>{ setPlay(false); t = D().tw*e.target.value/1000; dirty = true; };
  $('pvSpeed').onchange = e=>{ slow = parseFloat(e.target.value); };
}

let last = null;
function frame(ts){
  if (playing){
    if (last!=null){
      const tw = D().tw;
      t += (ts-last)/1000/slow;
      if (t>=tw){ t = tw; setPlay(false); }
      syncT();
    }
    last = ts; dirty = true;
  } else last = null;
  if (dirty){ draw(); dirty = false; }
  requestAnimationFrame(frame);
}

initControls();
requestAnimationFrame(frame);
})();
</script>

<div id="app"></div>
<style>
#app, #app * { box-sizing: border-box; font-family: "Segoe UI", Tahoma, Arial, sans-serif; }

  background:#d9d9d9;
  padding:14px;
  border-radius:6px;
  color:#111;
  max-width:100%;
}

  display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  margin-bottom:10px; font-size:13px;
}

  padding:5px 8px; border:1px solid #999; border-radius:3px; font-size:13px; width:220px;
}
#studentId{ width:170px; }
#groupId{ width:64px; }
.btn{
  padding:6px 12px; border:1px solid #6b6b6b; border-radius:3px; background:linear-gradient(#fdfdfd,#e2e2e2);
  cursor:pointer; font-size:13px;
}
.btn:hover{ background:linear-gradient(#f5f5f5,#d5d5d5); }
.btn:active{ background:#cfcfcf; }
.rightGroup{ margin-left:auto; display:flex; align-items:center; gap:8px; }
.gear{
  width:30px;height:30px;border-radius:50%;border:1px solid #999;
  background:#efefef;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;
}
.win{
  background:#efefef; border:1px solid #8a8a8a; border-radius:2px; margin-bottom:10px;
  box-shadow:1px 1px 4px rgba(0,0,0,.25);
}
.titlebar{
  background:linear-gradient(#f7f7f7,#dcdcdc); border-bottom:1px solid #b9b9b9;
  padding:4px 8px; font-size:12px; display:flex; align-items:center; gap:6px;
}
.titlebar .ico{width:12px;height:12px;display:inline-block;border-radius:2px;}

   Lab: Phase of alternating voltage — u(t) = Um·sin(ωt + φ0) on one
   voltmeter channel. The phasor diagram demo (PHASOR VIEW, above #app) is
   a separate task-specific module with its own sliders; it never reads
   engine state, so it does not reveal the student's individual variant.

   Going forward, write NEW TASK content (title/params/panels/answerFields)

   language switcher only translates the engine's own chrome text, never

   ========================================================================== */
const TASK = {

  id: 'ac-phase',

  // Parameters generated per student (deterministic hash of their ID,
  // within these ranges). n (periods in frame) only sets the time window.
  params: [
    {id:'f',  label:'Frequency',         unit:'Hz', min:50, max:100},
    {id:'Um', label:'Voltage amplitude', unit:'V',  min:5,  max:10},
    {id:'phi',label:'Initial phase',     unit:'°',  min:0,  max:360},
    {id:'n',  label:'Periods in frame',  unit:'',   min:2,  max:4}

  // u(t) = Um·sin(ωt + φ0) on a single voltmeter channel.
  simulate(P, quantize){
    const Um=P.Um, f=P.f, phi=P.phi*Math.PI/180;
    const omega = 2*Math.PI*f;
    const T = 1/f;
    const tMax = P.n*T;
    const N = 1600;
    const dt = tMax/N;
    const t = new Array(N+1), V = new Array(N+1);
    for(let i=0;i<=N;i++){
      t[i] = i*dt;
      V[i] = quantize(Um*Math.sin(omega*t[i]+phi), Um*1.2); // voltmeter, full scale with 20% headroom
    }
    return {
      t,
      series: { V },
      derived: { T, omega }
    };

// ---------- deterministic RNG from a string ----------
function hashStr(str){
  let h = 2166136261;
  for(let i=0;i<str.length;i++){
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rangeVal(rng, min, max){ return min + rng()*(max-min); }

function generateParams(id, c){
  const base = hashStr(id.trim().toLowerCase());
  const P = {};
  TASK.params.forEach((def, idx)=>{
    const rng = mulberry32(base ^ (0x1111 * (idx+1))); // fixed scheme, do not change
    const r = (c.paramRanges && c.paramRanges[def.id]) || {min:def.min, max:def.max};
    P[def.id] = rangeVal(rng, r.min, r.max);
  });
  P.noiseRng = mulberry32(base ^ 0x5555);
  return P;
}

// ---------- 16-bit ADC model: ±1–2 LSB dither, not an arbitrary "% amplitude" ----------
function quantizeADC(value, fullScaleRange, rng){
  const levels = Math.pow(2, ADC_BITS) - 1;
  const lsb = (2*fullScaleRange) / levels;
  const ditherLSB = rng ? (rng()*4 - 2) : 0;
  let v = value + ditherLSB*lsb;
  v = Math.max(-fullScaleRange, Math.min(fullScaleRange, v));
  return Math.round(v/lsb)*lsb;
}

function runSimulation(id){
  const P = generateParams(id, cfg);
  const quantize = (value, range) => quantizeADC(value, range, P.noiseRng);
  const result = TASK.simulate(P, quantize);
  result.series = { t: result.t, ...result.series };
  return { P, sim: result };
}

// ---------- series display metadata (taken from whichever panel references it) ----------
function seriesMeta(id){

    if (p.x===id) return {label:p.xLabel||id, unit:p.xUnit||'', scale:p.xScale||1, decimals:p.xDecimals??3};
    if (p.y===id) return {label:p.yLabel||id, unit:p.yUnit||'', scale:p.yScale||1, decimals:p.yDecimals??3};
  }
  return {label:id, unit:'', scale:1, decimals:3};
}
function answerCtx(){ return {params, derived: sim ? sim.derived : {}}; }

// ---------- circular difference in degrees (for isAngle fields) ----------
function angDiff(a,b){
  let d = Math.abs(a-b) % 360;
  if (d>180) d = 360-d;
  return d;
}

// ---------- in-app toast (no console.error, so the platform console never pops up) ----------
function showToast(msg, isError){
  let box = document.getElementById('appToast');
  if (!box){
    box = document.createElement('div');
    box.id = 'appToast';
    box.style.cssText = 'position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:999;'+
      'padding:8px 16px;border-radius:5px;font-size:13px;max-width:90vw;box-shadow:0 2px 8px rgba(0,0,0,.3);'+
      'transition:opacity .3s;';
    document.body.appendChild(box);
  }
  box.style.background = isError ? '#c0392b' : '#2d7a2d';
  box.style.color = '#fff';
  box.textContent = msg;
  box.style.opacity = '1';
  clearTimeout(box._hideTimer);
  box._hideTimer = setTimeout(()=>{ box.style.opacity='0'; }, 4000);
}

// ---------- storage: window.storage (Claude artifact) with localStorage fallback
// (for standalone .html files opened directly in a browser) ----------
const hasArtifactStorage = (typeof window.storage !== 'undefined' && window.storage !== null);

async function storageGet(key){
  if (hasArtifactStorage) return await window.storage.get(key, true);
  const raw = localStorage.getItem(LS_PREFIX+key);
  return raw!=null ? {key, value:raw, shared:false} : null;
}
async function storageSet(key, value){
  if (hasArtifactStorage) return await window.storage.set(key, value, true);
  localStorage.setItem(LS_PREFIX+key, value);
  return {key, value, shared:false};
}
async function storageList(prefix){
  if (hasArtifactStorage) return await window.storage.list(prefix, true);
  const keys = [];
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if (k && k.startsWith(LS_PREFIX+prefix)) keys.push(k.slice(LS_PREFIX.length));
  }
  return {keys};
}

// ---------- storage helpers ----------
async function loadConfig(){
  try{
    const r = await storageGet(CFG_KEY);
    cfg = r ? {...DEFAULT_CFG, ...JSON.parse(r.value)} : {...DEFAULT_CFG};
  }catch(e){ cfg = {...DEFAULT_CFG}; }
}
async function saveConfig(newCfg){
  cfg = newCfg;
  try{ await storageSet(CFG_KEY, JSON.stringify(cfg)); return true; }
  catch(e){ showToast(t('savingFailedConfig'), true); return false; }
}
async function saveResult(id, P, s){
  try{
    await storageSet(RESULTS_PREFIX+id, JSON.stringify({ id, group:studentGroup, params:P, derived:s.derived, ts: Date.now() }));
    return true;
  }catch(e){
    showToast(t('savingFailedResult'), true);
    return false;
  }
}
async function saveAnswer(id, values){
  try{
    await storageSet(ANSWERS_PREFIX+id, JSON.stringify({ id, values, submittedAt: Date.now() }));
    return true;
  }catch(e){
    showToast(t('savingFailedAnswer'), true);
    return false;
  }
}
// send the answer + reference values to the teacher's Google Sheet (Apps Script Web App)
async function sendToSheet(ansValues){
  if (!cfg.endpoint) return; // empty endpoint = self-check version — local save above already worked
  const ctx = answerCtx();
  const payload = { key: SHEET_KEY, studentId, group: studentGroup };
  TASK.answerFields.forEach(f=>{
    const applicable = !f.showIf || f.showIf(ctx);
    payload[f.id+'_ref'] = applicable ? f.ref(ctx) : null;
    const av = ansValues[f.id];
    payload[f.id+'_ans'] = (av==null || isNaN(av)) ? null : av;
  });
  try{
    // Apps Script Web Apps don't return CORS headers, so the response is opaque
    // (mode:'no-cors') — this can confirm the request was sent, not that it succeeded server-side.
    // keepalive:true — so the request isn't aborted if the student closes the tab
    // or navigates away right after clicking the button.
    await fetch(cfg.endpoint, {
      method:'POST', mode:'no-cors', keepalive:true,
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
    showToast(t('sentToSheet'), false);
  }catch(e){
    showToast(t('sentToSheetFail'), true);
  }
}
async function loadAnswer(id){
  try{ const r = await storageGet(ANSWERS_PREFIX+id); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function loadAllResults(){
  try{
    const list = await storageList(RESULTS_PREFIX);
    if (!list || !list.keys) return [];
    const out = [];
    for(const k of list.keys){
      try{ const r = await storageGet(k); if (r) out.push(JSON.parse(r.value)); }catch(e){}
    }
    for(const item of out){ item.answer = await loadAnswer(item.id); }
    return out.sort((a,b)=> (a.group||'').localeCompare(b.group||'') || a.id.localeCompare(b.id));
  }catch(e){ return []; }
}

// accepts both "," and "." as decimal separator (common mix-up for non-English-locale students)
function parseNum(str){
  if (str==null) return NaN;
  return parseFloat(String(str).trim().replace(',', '.'));
}

// ---------- niceNum for axis ticks ----------
function niceNum(range, round){
  const exp = Math.floor(Math.log10(range));
  const f = range/Math.pow(10,exp);
  let nf;
  if (round){
    if (f<1.5) nf=1; else if (f<3) nf=2; else if (f<7) nf=5; else nf=10;
  } else {
    if (f<=1) nf=1; else if (f<=2) nf=2; else if (f<=5) nf=5; else nf=10;
  }
  return nf*Math.pow(10,exp);
}

// ---------- drawing (fully generic: two numeric arrays, no notion of meaning) ----------
function drawPanel(canvas, xArr, yArr, opts){
  const W = canvas.width, H = canvas.height;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = "#f0f0f0";
  ctx.fillRect(0,0,W,H);

  const padL=48, padR=14, padT=14, padB=26;
  const plotW = W-padL-padR, plotH = H-padT-padB;

  const lo = opts.lo ?? 0, hi = opts.hi ?? (xArr.length-1);
  const xMin = xArr[lo], xMaxV = xArr[hi];
  const xSpan = (xMaxV-xMin) || 1;

  let yMax = 0;
  for(let i=lo;i<=hi;i++){ const a=Math.abs(yArr[i]); if(a>yMax) yMax=a; }
  yMax *= 1.15;
  if (yMax===0) yMax=1;

  const xToPx = v => padL + ((v-xMin)/xSpan)*plotW;
  const yToPx = v => padT + plotH/2 - (v/yMax)*(plotH/2);

  ctx.strokeStyle = "#d3d3d3"; ctx.lineWidth=1;
  ctx.font = "10px Tahoma"; ctx.fillStyle="#555";
  const xStep = niceNum(xSpan/10, true);
  const xStart = Math.ceil(xMin/xStep)*xStep;
  for(let xv=xStart; xv<=xMaxV+1e-9; xv+=xStep){
    const x = xToPx(xv);
    ctx.beginPath(); ctx.moveTo(x,padT); ctx.lineTo(x,H-padB); ctx.stroke();
    ctx.fillText(xv.toFixed(xStep<0.01?4:(xStep<0.1?3:2)), x-10, H-padB+14);
  }
  const yStep = niceNum(yMax/6, true);
  for(let yv=-Math.ceil(yMax/yStep)*yStep; yv<=yMax; yv+=yStep){
    const y = yToPx(yv);
    if (y<padT-2 || y>H-padB+2) continue;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.fillText(yv.toFixed(Math.abs(yv)<10?1:0), 4, y+3);
  }
  ctx.strokeStyle="#333"; ctx.lineWidth=1.2;
  const y0 = yToPx(0);
  ctx.beginPath(); ctx.moveTo(padL,y0); ctx.lineTo(W-padR,y0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(padL,padT); ctx.lineTo(padL,H-padB); ctx.stroke();

  ctx.strokeStyle = opts.color; ctx.lineWidth = 1.6;
  ctx.beginPath();
  for(let i=lo;i<=hi;i++){
    const x = xToPx(xArr[i]), y = yToPx(yArr[i]);
    if (i===lo) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();

  ctx.fillStyle = "#00000090";
  pinned.forEach(p=>{
    if (p.idx<lo || p.idx>hi) return;
    const x = xToPx(xArr[p.idx]), y = yToPx(yArr[p.idx]);
    ctx.beginPath(); ctx.arc(x,y,3.2,0,7); ctx.fill();
  });

  if (cursorIdx!=null && cursorIdx>=lo && cursorIdx<=hi){
    const x = xToPx(xArr[cursorIdx]), y = yToPx(yArr[cursorIdx]);
    ctx.strokeStyle = "#4466cc88"; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x,padT); ctx.lineTo(x,H-padB); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.fillStyle = opts.color;
    ctx.beginPath(); ctx.arc(x,y,3.5,0,7); ctx.fill();
  }

  if (opts.dragSel){
    const x1v = xArr[opts.dragSel.a], x2v = xArr[opts.dragSel.b];
    const x1 = xToPx(Math.min(x1v,x2v)), x2 = xToPx(Math.max(x1v,x2v));
    ctx.fillStyle = "rgba(50,110,220,0.15)";
    ctx.fillRect(x1, padT, x2-x1, plotH);
    ctx.strokeStyle = "rgba(50,110,220,0.6)"; ctx.lineWidth=1;
    ctx.strokeRect(x1, padT, x2-x1, plotH);
  }

  return {padL,padR,padT,padB,plotW,plotH,xMin,xMaxV,yMax,xToPx,yToPx};
}

// ---------- zoom (shared across all panels — same sample index range) ----------
let zoomLo = 0, zoomHi = null;
let dragging = false, dragStartIdx = null, dragCurIdx = null, dragStartClientX = null;

function zoomRange(){
  if (!sim) return [0,0];
  return zoomHi!=null ? [zoomLo, zoomHi] : [0, sim.t.length-1];
}
function resetZoom(){ zoomLo = 0; zoomHi = null; redraw(); }
function pixelToIdx(canvas, clientX){
  const rect = canvas.getBoundingClientRect();
  const xRatio = (clientX-rect.left)/rect.width;
  const padL=48/1600, padR=14/1600;
  const usable = 1-padL-padR;
  let frac = (xRatio-padL)/usable;
  frac = Math.min(1, Math.max(0, frac));
  const [lo,hi] = zoomRange();
  return Math.round(lo + frac*(hi-lo));
}

function fmtNum(v){
  if (v==null || isNaN(v)) return '—';
  const a = Math.abs(v);
  return v.toFixed(a<1?4:(a<100?2:1));
}

function attachCanvasEvents(canvas){
  function handlePos(clientX){
    if (!sim) return;
    cursorIdx = pixelToIdx(canvas, clientX);
    redraw();
  }
  canvas.addEventListener('mousemove', e=>{
    if (dragging){ dragCurIdx = pixelToIdx(canvas, e.clientX); redraw(); }
    else handlePos(e.clientX);
  });
  canvas.addEventListener('mouseleave', ()=>{ if (!dragging){ cursorIdx=null; redraw(); } });
  canvas.addEventListener('mousedown', e=>{
    if (!sim) return;
    e.preventDefault();
    dragging = true;
    dragStartIdx = pixelToIdx(canvas, e.clientX);
    dragCurIdx = dragStartIdx;
    dragStartClientX = e.clientX;
  });
  canvas.addEventListener('dblclick', ()=>{ if (sim) resetZoom(); });

  let lastTapTime = 0;
  canvas.addEventListener('touchstart', e=>{
    if (!sim) return;
    e.preventDefault();
    const touch = e.touches[0];
    if (!touch) return;
    const now = Date.now();
    if (now - lastTapTime < 350){
      dragging = false; dragStartIdx=null; dragCurIdx=null;
      resetZoom();
      lastTapTime = 0;
      return;
    }
    lastTapTime = now;
    dragging = true;
    dragStartIdx = pixelToIdx(canvas, touch.clientX);
    dragCurIdx = dragStartIdx;
    dragStartClientX = touch.clientX;
  }, {passive:false});
  canvas.addEventListener('touchmove', e=>{
    e.preventDefault();
    if (!sim || !e.touches[0]) return;
    if (dragging){ dragCurIdx = pixelToIdx(canvas, e.touches[0].clientX); redraw(); }
    else handlePos(e.touches[0].clientX);
  }, {passive:false});
}

function finishDrag(clientX){
  if (!dragging) return;
  dragging = false;
  if (!sim){ dragStartIdx=null; dragCurIdx=null; return; }
  const pixelDist = Math.abs(clientX - dragStartClientX);
  if (pixelDist < 5){
    cursorIdx = dragStartIdx;
    pinned.push({idx: cursorIdx});
    renderPointsTable();
  } else if (dragStartIdx!=null && dragCurIdx!=null && dragStartIdx!==dragCurIdx){
    let lo = Math.min(dragStartIdx, dragCurIdx), hi = Math.max(dragStartIdx, dragCurIdx);
    if (hi-lo < 4) hi = Math.min(sim.t.length-1, lo+4);
    zoomLo = lo; zoomHi = hi;
  }
  dragStartIdx = null; dragCurIdx = null;
  redraw();
}

let langMenuOutsideClickAttached = false;
function attachLangMenuOutsideClick(){
  if (langMenuOutsideClickAttached) return;
  langMenuOutsideClickAttached = true;
  document.addEventListener('click', (e)=>{
    const sw = document.getElementById('langSwitch');
    if (sw && !sw.contains(e.target)) sw.classList.remove('open');
  });
}

let globalMouseUpAttached = false;
function attachGlobalMouseUp(){
  if (globalMouseUpAttached) return;
  globalMouseUpAttached = true;
  window.addEventListener('mouseup', e=> finishDrag(e.clientX));
  window.addEventListener('touchend', e=>{
    const t = e.changedTouches && e.changedTouches[0];
    finishDrag(t ? t.clientX : dragStartClientX);
  });
  window.addEventListener('touchcancel', ()=>{ dragging=false; dragStartIdx=null; dragCurIdx=null; });
}

function redraw(){
  if (!sim){
    els.panels && els.panels.forEach(p=>{
      const c = p.canvas, ctx = c.getContext('2d');
      ctx.fillStyle="#f0f0f0"; ctx.fillRect(0,0,c.width,c.height);
      ctx.fillStyle="#888"; ctx.font="16px Tahoma";
      ctx.fillText(t('canvasHint'), 30, c.height/2);
    });
    return;
  }
  const [lo,hi] = zoomRange();
  const dragSel = (dragging && dragStartIdx!=null && dragCurIdx!=null && dragStartIdx!==dragCurIdx)
    ? {a:dragStartIdx, b:dragCurIdx} : null;

  els.panels.forEach(p=>{
    const def = p.def;
    const xScale = def.xScale||1, yScale = def.yScale||1;
    const xArr = sim.series[def.x].map(v=>v*xScale);
    const yArr = sim.series[def.y].map(v=>v*yScale);
    drawPanel(p.canvas, xArr, yArr, {color:def.color, lo, hi, dragSel});
    if (cursorIdx!=null){
      p.readout.innerHTML = `— ${def.yLabel}: ${yArr[cursorIdx].toFixed(def.yDecimals??2)} ${def.yUnit};&nbsp;&nbsp;${def.xLabel}: ${xArr[cursorIdx].toFixed(def.xDecimals??4)} ${def.xUnit}`;
    } else {
      p.readout.innerHTML = `— ${def.yLabel}: —&nbsp;${def.yUnit};&nbsp;&nbsp;${def.xLabel}: — ${def.xUnit}`;
    }
  });

  if (els.zoomTag) els.zoomTag.style.display = (zoomHi!=null) ? 'inline' : 'none';
  renderPointsTable();
  // IMPORTANT: renderAnswerPanel() is deliberately NOT called here — otherwise every
  // cursor move over the graph would rebuild the input fields and wipe answers the
  // student already typed. It's only called from render() (once, on start/panel
  // switch) and from onStart().
}

function seriesIds(){
  return Object.keys(sim.series);
}

function renderPointsTable(){
  const ids = seriesIds();
  els.ptsHeadRow.innerHTML = '<th>#</th>' + ids.map(id=>{
    const m = seriesMeta(id);
    return `<th>${m.label}${m.unit?', '+m.unit:''}</th>`;
  }).join('');
  els.ptsBody.innerHTML = pinned.map((p,i)=>{
    const cells = ids.map(id=>{
      const m = seriesMeta(id);
      const v = sim.series[id][p.idx]*m.scale;
      return `<td>${v.toFixed(m.decimals)}</td>`;
    }).join('');
    return `<tr><td>${i+1}</td>${cells}</tr>`;
  }).join('');
}

function copyPointsTable(){
  if (!sim || !pinned.length){ return; }
  const ids = seriesIds();
  const header = ids.map(id=>{ const m=seriesMeta(id); return `${m.label}${m.unit?', '+m.unit:''}`; }).join("\t")+"\n";
  const body = pinned.map(p=> ids.map(id=>{
    const m = seriesMeta(id);
    return (sim.series[id][p.idx]*m.scale).toFixed(m.decimals);
  }).join("\t")).join("\n");
  const text = header+body;
  navigator.clipboard?.writeText(text).catch(()=>{
    const ta = document.createElement('textarea');
    ta.value=text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
  });
}

async function onStart(){
  const id = els.studentId.value.trim();
  if (!id){
    // ID is optional by design (not blocked) — empty runs are allowed after
    // an explicit confirm, and flow through the exact same generation
    // scheme with an empty string (no separate "anonymous" seed logic).
    const proceed = confirm(t('anonConfirm'));
    if (!proceed){ els.studentId.focus(); return; }
  }
  studentId = id;
  studentGroup = els.groupId.value.trim();
  const r = runSimulation(id);
  params = r.P;
  sim = r.sim;
  pinned = [];
  cursorIdx = null;
  zoomLo = 0; zoomHi = null;
  redraw();
  renderAnswerPanel();
  const ok = await saveResult(id, params, sim);
  if (ok) showToast(t('measurementStarted'), false);
}

// ---------- checking one answer: percentage or angular (isAngle) ----------
function checkOneField(f, val, ref){
  if (isNaN(val)) return {ok:false, text:`${f.label.split(',')[0]}: ${t('notSpecified')}`};
  if (f.isAngle){
    const d = angDiff(val, ref);
    const tol = f.angleTolDeg ?? cfg.phaseTol ?? 10;
    const ok = d<=tol;
    return {ok, text:`${f.label.split(',')[0]}: ${val}° ${ok?'✅':'❌'} ${t('deviationDeg', d.toFixed(0), tol)}`};
  }
  const err = Math.abs(val-ref)/Math.abs(ref)*100;
  const ok = err <= (f.tolerancePct ?? 15);
  return {ok, text:`${f.label.split(',')[0]}: ${val} ${f.unit||''} ${ok?'✅':'❌'} ${t('deviationPct', err.toFixed(0))}`};
}

function renderAnswerPanel(){
  const box = document.getElementById('answerPanel');
  if (!box) return;
  if (!sim){ box.innerHTML = ""; return; }
  const ctx = answerCtx();
  const visibleFields = TASK.answerFields.filter(f=>!f.showIf || f.showIf(ctx));
  box.innerHTML = `
    <b style="font-size:13px;">${t('yourAnswerTitle')}</b>
    <div class="row2">
      ${visibleFields.map(f=>`<div><label>${f.label}</label><input id="ans_${f.id}" type="text" placeholder="${f.placeholder||''}"></div>`).join('')}
    </div>
    <button class="btn" id="submitAns">${t('checkBtn')}</button>
    <div id="ansFeedback" style="margin-top:8px;font-size:13px;"></div>
  `;
  document.getElementById('submitAns').onclick = async ()=>{
    const ansValues = {};
    visibleFields.forEach(f=>{ ansValues[f.id] = parseNum(document.getElementById('ans_'+f.id).value); });
    // NOTE: checks !sim, not !studentId — studentId can legitimately be an
    // empty string for an anonymous run, which is falsy and would otherwise
    // wrongly look like "no measurement started yet".
    if (!sim){ alert(t('startFirst')); return; }
    const ok = await saveAnswer(studentId, ansValues);
    await sendToSheet(ansValues);
    const fb = document.getElementById('ansFeedback');
    const rows = visibleFields.map(f=>{
      const r = checkOneField(f, ansValues[f.id], f.ref(ctx));
      return `<div style="color:${r.ok?'#0a7a1f':'#b30000'};">${r.text}</div>`;
    });
    let footer;
    if (cfg.endpoint){
      footer = ok
        ? `<div class="small" style="margin-top:4px;">${t('answerSentNote')}</div>`
        : `<div class="small" style="margin-top:4px;color:#b30000;">${t('answerSendFailedNote')}</div>`;
    } else {
      footer = `<div class="small" style="margin-top:4px;">${t('selfCheckNote')}</div>`;
    }
    fb.innerHTML = rows.join('') + footer;
  };
}

    const r = cfg.paramRanges[p.id] || {min:p.min, max:p.max};
    return `
        <div><label>${p.label} min, ${p.unit}</label><input id="pmin_${p.id}" value="${r.min}"></div>
        <div><label>${p.label} max, ${p.unit}</label><input id="pmax_${p.id}" value="${r.max}"></div>`;
  }).join('');
  const hasAngleField = TASK.answerFields.some(f=>f.isAngle);
  bg.innerHTML = `
    <div class="modal">
      <h3>${t('settingsTitle')}</h3>
      <div class="row2">
        ${paramRows}
        ${hasAngleField ? `<div><label>${t('phaseTolLabel')}</label><input id="phaseTol" value="${cfg.phaseTol}"></div>` : ``}
        <div><label>${t('newKeyLabel')}</label><input id="key" value="${cfg.key}"></div>
        <div style="grid-column:1/-1;"><label>${t('endpointLabel')}</label><input id="endpoint" value="${cfg.endpoint||''}" placeholder="https://script.google.com/macros/s/.../exec"></div>
      </div>
      <div class="actions">
        <button class="btn" id="showResults">${t('showResultsBtn')}</button>
        <button class="btn" id="cfgCancel">${t('closeBtn')}</button>
        <button class="btn" id="cfgSave">${t('saveBtn')}</button>
      </div>
      <div id="resultsArea"></div>
    </div>`;
  document.body.appendChild(bg);
  document.getElementById('cfgCancel').onclick=()=>{ bg.remove(); render(); };
  document.getElementById('cfgSave').onclick=async ()=>{
    const paramRanges = {};
    TASK.params.forEach(p=>{
      paramRanges[p.id] = {
        min: parseNum(document.getElementById('pmin_'+p.id).value),
        max: parseNum(document.getElementById('pmax_'+p.id).value)
      };
    });
    const newCfg = {
      paramRanges,
      phaseTol: hasAngleField ? parseNum(document.getElementById('phaseTol').value) : cfg.phaseTol,
      key: document.getElementById('key').value || cfg.key,
      endpoint: document.getElementById('endpoint').value.trim()
    };
    const ok = await saveConfig(newCfg);
    if (ok) alert(t('savedAlert'));
    bg.remove();
    render();
  };
  document.getElementById('showResults').onclick= async ()=>{
    const area = document.getElementById('resultsArea');
    area.innerHTML = t('loadingText');
    const results = await loadAllResults();
    if (!results.length){ area.innerHTML = `<p class='small'>${t('noResultsText')}</p>`; return; }
    function fmtAns(f, val, ref){
      if (val==null || isNaN(val)) return `<span class="small">${t('notSubmitted')}</span>`;
      if (ref==null) return val;
      const r = checkOneField(f, val, ref);
      return `<span style="color:${r.ok?'#0a7a1f':'#b30000'};">${val} ${r.ok?'✅':'❌'}</span>`;
    }
    const headCells = TASK.answerFields.map(f=>`<th>${f.shortLabel||f.id} ${t('givenSuffix')}</th><th>${f.shortLabel||f.id} ${t('answerSuffix')}</th>`).join('');
    area.innerHTML = `
      <table class="resulttable">
        <thead><tr><th>${t('groupCol')}</th><th>${t('studentCol')}</th>${headCells}</tr></thead>
        <tbody>
          ${results.map(r=>{
            const ctx = {params:r.params, derived:r.derived||{}};
            const cells = TASK.answerFields.map(f=>{
              const applicable = !f.showIf || f.showIf(ctx);
              const ref = applicable ? f.ref(ctx) : null;
              const ans = r.answer?.values?.[f.id];
              return `<td>${ref!=null?fmtNum(ref):'—'}</td><td>${applicable?fmtAns(f, ans, ref):'—'}</td>`;
            }).join('');
            return `<tr><td>${r.group||''}</td><td>${r.id}</td>${cells}</tr>`;
          }).join('')}
        </tbody>
      </table>`;
  };
}

// ---------- init ----------
(async function init(){
  document.title = TASK.title;
  attachGlobalMouseUp();
  await loadConfig();
  try{
    const r = await storageGet(LANG_KEY);
    if (r && LANGS.includes(r.value)) uiLang = r.value;
  }catch(e){}
  render();
})();

})();
</script>
</body>
</html>
